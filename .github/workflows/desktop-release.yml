name: Native desktop bundles

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/package-desktop.sh'
      - 'scripts/launch-native*'
      - 'start.cmd'
      - 'start.sh'
      - 'start.command'
      - 'compose.native.yml'
      - '.github/workflows/desktop-release.yml'
      - 'src/MiniPdm.Desktop/**'
      - 'src/MiniPdm.Contracts/**'
      - 'src/**'
      - 'MiniPdm.sln'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/**'
      - 'docker-compose.yml'
      - '.config/**'
      - 'Directory.Build.props'
      - 'global.json'

permissions:
  contents: read

jobs:
  docker-native-export-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [linux-x64, win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Export self-contained native executable
        run: docker buildx build --target native-export --build-arg PDM_DESKTOP_RID=${{ matrix.rid }} --output type=local,dest=/tmp/minipdm-export-${{ matrix.rid }} .
      - name: Verify exported application files
        shell: bash
        run: |
          if [[ '${{ matrix.rid }}' == win-* ]]; then
            test -f /tmp/minipdm-export-${{ matrix.rid }}/MiniPdm.Desktop.exe
          else
            test -x /tmp/minipdm-export-${{ matrix.rid }}/MiniPdm.Desktop
          fi
          test -f /tmp/minipdm-export-${{ matrix.rid }}/MiniPdm.Desktop.runtimeconfig.json
          python3 -c 'import json,sys; x=json.load(open(sys.argv[1]))["runtimeOptions"]; assert x.get("includedFrameworks") and not x.get("framework") and not x.get("frameworks")' /tmp/minipdm-export-${{ matrix.rid }}/MiniPdm.Desktop.runtimeconfig.json

  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native bundle
        run: bash scripts/package-desktop.sh "$GITHUB_WORKSPACE/artifacts" "${{ matrix.rid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mini-pdm-${{ matrix.rid }}
          path: artifacts/mini-pdm-${{ matrix.rid }}.*
          if-no-files-found: error
          retention-days: 30
